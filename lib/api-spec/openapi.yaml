        - declinesByStage
        - moreInfoLoopCount
        - avgTimePerStageHours
        - overdueCount
      properties:
        stageCounts:
          type: object
          description: "Count of ETOs currently in each stage"
          additionalProperties:
            type: integer
        totalOpen:
          type: integer
        totalWon:
          type: integer
        totalDeclined:
          type: integer
        totalLost:
          type: integer
        declinesByStage:
          type: object
          description: "How many declines happened from each stage"
          additionalProperties:
            type: integer
        moreInfoLoopCount:
          type: integer
          description: "Total number of more-info requests across all ETOs"
        avgTimePerStageHours:
          type: object
          description: "Average hours spent in each stage across all ETOs"
