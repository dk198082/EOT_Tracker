
name: ETO Tracker - Azure Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: eotprod
  IMAGE_NAME: eto-tracker
  RESOURCE_GROUP: toaxrgp
  WEBAPP_NAME: EOTTraceProd

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Azure login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push Docker image
        run: |
          az acr build \
            --registry "$ACR_NAME" \
            --image "$IMAGE_NAME:${GITHUB_SHA}" \
            --image "$IMAGE_NAME:latest" \
            .

      - name: Update Azure App Service container
        run: |
          az webapp sitecontainers update \
            --resource-group "$RESOURCE_GROUP" \
            --name "$WEBAPP_NAME" \
            --container-name main \
            --image "$ACR_NAME.azurecr.io/$IMAGE_NAME:${GITHUB_SHA}" \
            --target-port 8080 \
            --is-main true \
            --system-assigned-identity true

      - name: Restart App Service
        run: |
          az webapp restart \
            --resource-group "$RESOURCE_GROUP" \
            --name "$WEBAPP_NAME"
