name: ETO Tracker - Azure Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: eotprod
  IMAGE_NAME: eto-tracker
  RESOURCE_GROUP: toaxrgp
  WEBAPP_NAME: EOTTraceProd

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Inspect GitHub OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('api://AzureADTokenExchange');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );

            console.log('Issuer:', payload.iss);
            console.log('Subject:', payload.sub);
            console.log('Audience:', payload.aud);
            console.log('Repository:', payload.repository);
            console.log('Repository ID:', payload.repository_id);
            console.log('Owner:', payload.repository_owner);
            console.log('Owner ID:', payload.repository_owner_id);
            console.log('Ref:', payload.ref);
            console.log('Workflow ref:', payload.job_workflow_ref); 

      - name: Verify Azure Client ID
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          if [ "$AZURE_CLIENT_ID" = "2adc974f-a575-4d1d-a05c-401c004e0a7a" ]; then
            echo "Azure Client ID matches ETO-GitHub-Deployment"
          else
            echo "::error::Azure Client ID does not match"
            exit 1
          fi
      - name: Azure login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push Docker image
        run: |
          az acr build \
            --registry "$ACR_NAME" \
            --image "$IMAGE_NAME:${GITHUB_SHA}" \
            --image "$IMAGE_NAME:latest" \
            .

      - name: Update Azure App Service container
        run: |
          az webapp sitecontainers update \
            --resource-group "$RESOURCE_GROUP" \
            --name "$WEBAPP_NAME" \
            --container-name main \
            --image "$ACR_NAME.azurecr.io/$IMAGE_NAME:${GITHUB_SHA}" \
            --target-port 8080 \
            --is-main true \
            --system-assigned-identity true

      - name: Restart App Service
        run: |
          az webapp restart \
            --resource-group "$RESOURCE_GROUP" \
            --name "$WEBAPP_NAME"
